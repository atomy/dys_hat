// Dystopia Hats - addons/sourcemod/configs/dys_hats.cfg
// Read at every map start (and by sm_hats_reload). The "settings" here win over server.cfg.
//
// Each hat: an id (what players type: !hat <id>), a menu name, a model that ships with the game
// (players download nothing), and where it sits:
//   pos   "fwd left up"         units from the player model's "eyes" attachment (the head's centre is ~5 u behind it,
//                               the top of the head ~3-6 u above it)
//   ang   "pitch yaw roll"      relative to the head; roll 180 = upside down (buckets and pots as helmets)
//   scale "1.0"                 optional
// Try new values live with: sm_hats_tune <id> pos <fwd> <left> <up>  (prints the line to paste here)
"DysHats"
{
	"settings"
	{
		"sm_hats_enabled"    "1"
		"sm_hats_default"    "none"   // hat for players who never picked one; "none" = bare heads
		"sm_hats_bots"       "0"      // 0 = bots wear no hat, 1 = the default hat, 2 = a random hat
		"sm_hats_drop"       "1"      // the hat falls off when its wearer dies
		"sm_hats_drop_time"  "8"      // seconds a fallen hat stays
		"sm_hats_hide_own"   "1"      // don't draw your own hat in first person
		"sm_hats_plush"      "1"      // players may wear the plush backpack (!plush)
		"sm_hats_plush_bots" "0"      // 1 = bots wear it too
	}
	"hats"
	{
		"cone"      { "name" "Traffic cone"   "model" "models/props_junk/trafficcone001a.mdl"         "pos" "-5 0 17"   "ang" "0 0 0" }
		"bucket"    { "name" "Metal bucket"   "model" "models/props_junk/metalbucket01a.mdl"          "pos" "-5 0 10"   "ang" "0 0 180" }
		"pail"      { "name" "Plastic bucket" "model" "models/props_junk/plasticbucket001a.mdl"       "pos" "-5 0 16"   "ang" "0 0 180" }
		"pot"       { "name" "Cooking pot"    "model" "models/props_c17/metalpot001a.mdl"             "pos" "-5 0 8.5"  "ang" "0 0 180" }
		"flowerpot" { "name" "Flower pot"     "model" "models/props_junk/terracotta01.mdl"            "pos" "-5 0 15"   "ang" "0 0 180" }
		"lampshade" { "name" "Lamp shade"     "model" "models/props_c17/lampshade001a.mdl"            "pos" "-5 0 8"    "ang" "0 0 0" }
		"melon"     { "name" "Watermelon"     "model" "models/props_junk/watermelon01.mdl"            "pos" "-5 0 11"   "ang" "0 0 0" }
		"milk"      { "name" "Milk carton"    "model" "models/props_junk/garbage_milkcarton001a.mdl"  "pos" "-5 0 12"   "ang" "0 0 0" }
		"can"       { "name" "Soda can"       "model" "models/props_junk/popcan01a.mdl"               "pos" "-5 0 8"    "ang" "0 0 0" }
		"hula"      { "name" "Hula doll"      "model" "models/props_lab/huladoll.mdl"                 "pos" "-5 0 5"    "ang" "0 0 0" }
		"halo"      { "name" "Saw-blade halo" "model" "models/props_junk/sawblade001a.mdl"            "pos" "-5 0 14"   "ang" "0 0 0" }
	}

	// !plush: the heavy plush from dys_fortress worn as a backpack. Per player model: the attachment it hangs on and
	// the offset from it ("pos" x y z, "ang" pitch yaw roll in that attachment's frame). The values come from each
	// class model's bind pose: waist to head height, back against the wearer's back, face looking backwards.
	// The "katana" (upper chest) models were then tuned in game (2026-10-09, light_punk by eye; the others got the
	// same correction): the rifle stance twists the upper body ~45 deg against the bind pose.
	// Try values live with: sm_plush_tune light_punk pos <x> <y> <z>   (prints the line for this block)
	"plush"
	{
		"model"  "models/twincannon/plush_heavy.mdl"
		"scale"  "1.2"
		"models/player/light_punk.mdl"   { "attachment" "katana"  "pos" "-24.0 6.0 -4.0"    "ang" "-40 70 110" }
		"models/player/light_corp.mdl"   { "attachment" "katana"  "pos" "-23.4 5.1 -4.2"    "ang" "-40 70 110" }
		"models/player/medium_punk.mdl"  { "attachment" "katana"  "pos" "-23.4 4.4 -4.2"    "ang" "-40 70 110" }
		"models/player/medium_corp.mdl"  { "attachment" "katana"  "pos" "-16.1 -2.2 -6.8"   "ang" "-41 72 111" }
		"models/player/heavy_punk.mdl"   { "attachment" "eyes"    "pos" "-26.5 0.0 -30.4"   "ang" "2 0 0" }
		"models/player/heavy_corp.mdl"   { "attachment" "eyes"    "pos" "-22.5 0.0 -30.5"   "ang" "-4 0 0" }
		"default"                        { "attachment" "eyes"    "pos" "-24.0 0.0 -30.5"   "ang" "0 0 0" }
	}
}
