// Dystopia Girl - addons/sourcemod/configs/dys_girl.cfg
// Read at every map start (and by sm_girl_reload). The "settings" here win over server.cfg.
//
// Each skin: an id (what players type: !skin <id>; !pink = !skin pink), a custom player model that stands in for ONE
// stock "base" model for the players who pick it, and the folder of its materials. Unlike the hats of dys_hats these
// files are NOT in the game: copy the repo's content/ folder into the server's dystopia/, and the plugin puts "model"
// (+ its .vvd/.vtx/.phy) and every file in "materials" into the download table at each map start. A skin whose model
// the server doesn't have is skipped (one error in the log). "name" and "class" are only shown to players.
"DysGirl"
{
	"settings"
	{
		"sm_girl_enabled" "1"      // players may pick a skin (!pink, !skin); 0 = nobody gets one
		"sm_girl_default" "none"   // skin for players who never picked one; "none" = the stock models
		"sm_girl_bots"    "0"      // 0 = bots never get a skin, 1 = the default skin
	}
	"skins"
	{
		"pink"
		{
			"name"      "Pink Light Punk"
			"class"     "Punk Light"
			"model"     "models/player/light_punk_pink.mdl"
			"base"      "models/player/light_punk.mdl"
			"materials" "materials/models/player/light_punk_pink"
		}
	}
}
